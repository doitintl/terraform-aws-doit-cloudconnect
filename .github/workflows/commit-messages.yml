name: Commit Messages

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  checkcommits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit messages
        id: checkcommits
        continue-on-error: true
        # --safe omits commit messages from output, printing only hashes.
        # This prevents untrusted commit messages from injecting special
        # characters that could break shell expansion, base64 encoding,
        # or the GitHub Actions expression context used downstream.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/dev/check-commits.sh --safe "origin/${BASE_REF}" "$HEAD_SHA" 2>&1 | tee "$RUNNER_TEMP/checkcommits.txt"
          rc=${PIPESTATUS[0]}
          echo "output=$(base64 -w0 "$RUNNER_TEMP/checkcommits.txt")" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Post failure comment
        if: steps.checkcommits.outcome == 'failure' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- ci-checkcommits-mark -->';
            const output = Buffer.from('${{ steps.checkcommits.outputs.output }}', 'base64').toString('utf8').replace(/`/g, '\\`');
            const body = [
              marker,
              '## Commit Message Lint Failed',
              '',
              'One or more commit messages do not follow the [Conventional Commits](https://www.conventionalcommits.org/) format.',
              '',
              '<details>',
              '<summary>Details</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Remove stale comment
        if: steps.checkcommits.outcome == 'success' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- ci-checkcommits-mark -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }
